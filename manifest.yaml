id: "kandev-antigravity-usage"
api_version: 1
version: "0.2.0"
display_name: "Antigravity Usage"
description: "Show usage quotas, limits, and reset times for each Antigravity agent profile."
author: "nikandlv"
categories: ["tools"]

min_kandev_version: "0.86.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

capabilities:
  events: []
  state: true

actions:
  - key: "profiles.list"
    scope: "workspace"
    max_body_bytes: 4096
  - key: "profiles.usage"
    scope: "workspace"
    max_body_bytes: 16384

webhooks:
  - key: "usage"
    description: "Returns JSON usage for all Antigravity agent profiles."
    method: "POST"
    access: "authenticated"

ui:
  bundle: "/ui/bundle.js"

config_schema:
  type: object
  properties:
    agx_dir:
      type: string
      title: "Agx Profiles Directory"
      description: "Path to .agx multi-account profiles directory (empty = ~/.agx)"
      default: ""
    agy_binary:
      type: string
      title: "Agy Binary"
      description: "Path to agy executable (empty = auto-detect /opt/homebrew/bin/agy or in PATH)"
      default: ""
